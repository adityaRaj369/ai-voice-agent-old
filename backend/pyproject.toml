[project]
name = "frontline-os-api"
version = "1.0.0"
description = "Frontline OS FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "httpx==0.28.1",
  "sqlalchemy==2.0.43",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "python-dotenv==1.1.1",
  "python-multipart==0.0.20",
  "email-validator==2.2.0",
]

[tool.vercel]
entrypoint = "app.main:app"
